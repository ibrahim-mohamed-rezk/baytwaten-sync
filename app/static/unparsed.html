<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسايل مااتقرتش – بيت الوطن</title>
<link rel="stylesheet" href="/static/shell.css">
<style>
  main { max-width:1000px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .day { color:var(--muted); font-size:13px; font-weight:600; margin:18px 4px 8px; }
  .msg { margin-bottom:12px; overflow:hidden; border-inline-start:4px solid var(--red); }
  .msg.st-hidden { border-inline-start-color:var(--gray); opacity:.85; }
  .msg.st-saved { border-inline-start-color:var(--green); }
  .msg-head { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line); }
  .msg-head .id { font-weight:700; font-size:15px; }
  .chip { padding:2px 10px; border-radius:999px; background:var(--soft); font-size:12px; }
  .chip.red { background:#fee2e2; color:#991b1b; } .chip.green { background:#dcfce7; color:#166534; }
  .chip.gray { background:#e5e7eb; color:#374151; }
  .msg-head .actions { margin-inline-start:auto; display:flex; gap:6px; align-items:center; }
  a.tg-btn { background:#229ed9; color:#fff; text-decoration:none; padding:6px 12px; border-radius:8px; font-size:13px; }
  .reason { margin:12px 16px 0; background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:8px; padding:8px 12px; font-size:13px; }
  .facts { display:flex; gap:18px; flex-wrap:wrap; padding:10px 16px 0; font-size:13px; color:var(--muted); }
  .facts b { color:var(--text); font-weight:600; }
  pre.text { white-space:pre-wrap; margin:12px 16px 16px; background:#fafbfd; border:1px solid var(--line); border-radius:8px;
             padding:12px 14px; font:14px/1.7 "Segoe UI", Tahoma, sans-serif; }
  .note { padding:8px 16px 0; font-size:13px; }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <div>
      <h1>📨 رسايل مااتقرتش</h1>
      <p>رسايل في القناة فيها "تم حجز" بس شكلها مختلف، فمااتسجلتش كحجز. كل رسالة معاها السبب ونصها كامل.</p>
    </div>
  </div>
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <span class="grow"></span>
    <span class="muted" id="liveNote"></span>
  </div>
  <div id="list"><div class="empty">بيحمّل…</div></div>
</main>

<script src="/static/shell.js"></script>
<script>
const TABS = [["open", "محتاجة نظرة"], ["hidden", "اتخفت"], ["saved", "اتسجلت بعد كده"], ["all", "الكل"]];
const stateOf = u => u.plot ? "saved" : u.dismissed ? "hidden" : "open";
let tab = "open", items = [];

function dayLabel(d) {
  const iso = x => x.toLocaleDateString("en-CA");
  return d === iso(new Date()) ? "النهارده" : d === iso(new Date(Date.now() - 864e5)) ? "امبارح" : d;
}
const when = iso => iso ? `${iso.slice(0, 10) === new Date().toLocaleDateString("en-CA") ? "" : iso.slice(0, 10) + " "}${t12(iso)}` : "";

function render() {
  const n = { open: 0, hidden: 0, saved: 0, all: items.length };
  items.forEach(u => n[stateOf(u)]++);
  $("tabs").innerHTML = TABS.map(([k, l]) => `<button data-k="${k}" class="${k === tab ? "active" : ""}">${l} (${n[k]})</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.k; render(); });

  const shown = items.filter(u => tab === "all" || stateOf(u) === tab);
  if (!shown.length) {
    $("list").innerHTML = `<div class="card empty">${tab === "open" ? "✅ مفيش رسايل محتاجة نظرة" : "مفيش رسايل هنا"}</div>`;
    return;
  }
  let day = null, html = "";
  for (const u of shown) {
    const d = (u.posted_at || u.at).slice(0, 10);
    if (d !== day) { html += `<div class="day">${esc(dayLabel(d))}</div>`; day = d; }
    const st = stateOf(u), link = tgLink(u.msg_id);
    const chip = { open: `<span class="chip red">محتاجة نظرة</span>`, hidden: `<span class="chip gray">اتخفت من اللوحة</span>`,
                   saved: `<span class="chip green">اتسجلت كحجز بعد كده</span>` }[st];
    html += `<div class="card msg st-${st}">
      <div class="msg-head">
        <span class="id">#${u.msg_id}</span>${chip}
        ${u.counter ? `<span class="chip">إجمالي اليوم: ${u.counter}</span>` : ""}
        ${u.deleted ? `<span class="chip gray">اتمسحت من القناة</span>` : ""}
        <div class="actions">
          ${link ? `<a class="tg-btn" href="${link}" title="بيفتح الرسالة في برنامج التليجرام">✈️ افتح في التليجرام</a>` : ""}
          ${st === "open" ? `<button data-a="dismiss" data-id="${u.msg_id}" title="مش هتظهر في تنبيه اللوحة تاني">✕ اخفيها</button>` : ""}
          ${st === "hidden" ? `<button data-a="restore" data-id="${u.msg_id}">↩ رجّعها للوحة</button>` : ""}
        </div>
      </div>
      <div class="facts">
        ${u.posted_at ? `<span>اتنشرت: <b>${esc(when(u.posted_at))}</b></span>` : ""}
        ${u.edited_at ? `<span>اتعدلت: <b>${esc(when(u.edited_at))}</b></span>` : ""}
        <span>وصلتنا: <b>${esc(when(u.at))}</b></span>
      </div>
      ${st === "saved" ? `<div class="note">اتسجلت بعد كده كقطعة <a class="link" href="/?q=${encodeURIComponent(u.plot.plot)}">${esc(u.plot.city)} – رقم ${esc(u.plot.plot)} ↗</a>
        <span class="status s-${u.plot.status}">${STATUS[u.plot.status]}</span></div>` : ""}
      <div class="reason">⚠️ ليه مااتقرتش: ${esc(u.reason)}</div>
      <pre class="text">${esc(u.text)}</pre>
    </div>`;
  }
  $("list").innerHTML = html;
}

async function load() {
  const r = await api("/api/unparsed");
  items = r.items;
  $("liveNote").textContent = r.live ? "النصوص والمواعيد متحدّثة من القناة دلوقتي" : "القناة مش متوصلة، فده النص المتسجل عندنا";
  render();
}

$("list").addEventListener("click", async e => {
  const { a, id } = e.target.dataset; if (!a) return;
  e.target.disabled = true;
  try {
    await api(`/api/unparsed/${id}/${a}`, "POST");
    toast(a === "dismiss" ? `اتخفت رسالة #${id} من اللوحة` : `رجعت رسالة #${id} للوحة`, false);
  } catch (err) { toast("⚠️ " + err.message, false); }
  await load();
  Shell.refresh().catch(() => {});
});

const pick = new URLSearchParams(location.search).get("tab");
if (TABS.some(([k]) => k === pick)) tab = pick;
Shell.refresh().catch(() => {}).finally(() =>
  load().catch(e => { $("list").innerHTML = `<div class="alert err">⚠️ السيرفر مش شغال؟ ${esc(e.message)}</div>`; }));
</script>
</body>
</html>
